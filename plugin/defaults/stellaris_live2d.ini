; stellaris_live2d.dll settings. The plugin re-reads this file every 2 seconds while the game runs, so a change applies at once.
; Edit it in the Stellaris launcher (Plugins page, the gear button) or by hand: config\stellaris_live2d.ini in the plugin's folder.
[live2d]
; proof of concept: paint a test pattern into the render target of every visible portrait (0 = off)
test_pattern=0
; only paint render targets of exactly this size (0 = every size), e.g. 575x380 for the character portraits
only_width=0
only_height=0
; Live2D: draw a model into the render target of every visible portrait (0 = off). Needs core_dll and model.
live2d=1
; path of Live2DCubismCore.dll (Live2D's own, or a compatible one such as Purism Core); empty = the one in the plugin's folder
core_dll=
; path of the model's model3.json (one model), shown with the view_* values below
model=
; or several models, separated by ';': path, path|x,y,h (that view) or path|auto or path|auto:0.5 (a view worked out from the model: from the head down, that fraction of the figure's height; default 0.46).
; Each portrait gets one of them, handed out in turn when the portrait is first seen.
models=
; the part of the model canvas that is shown, as fractions of the canvas: centre from the left, centre from the top, height
view_x=0.44
view_y=0.19
view_h=0.26
; how many times a second the model is advanced and redrawn
fps=30
; secondary motion (hair, clothes) from the model's physics3.json
physics=1
; mod root folders read as if they were enabled (development): the portrait registrations in them are used
extra_mod_dirs=
; the interactions mods declare (mouse follow, ...); 0 = the models only play their own motions
interactions=1
; voice lines: a motion started by a click says its line (model3.json `Sound`, or the mod's `sounds`); master volume 0..1
; memory the loaded models may take, in MB (0 = no limit). Models are loaded in the background; within this limit all of them in
; advance, beyond it when a portrait first needs one (the game's own portrait shows until it is ready), dropping the one unused longest
model_cache_mb=512
; 2 = draw the models at twice the size and average down (crisper fine lines, costs little); 1 = off
supersample=2
; the voice follows the game's own sound settings (master and the slider named here: voice, effects, or none = only `volume`)
volume_channel=voice
; 1 = silent while the game window is not in front (the game itself keeps playing then)
mute_in_background=0
audio=1
volume=0.8
